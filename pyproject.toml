[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wavefront-reconstruction"
version = "0.1.0"
description = "Wavefront reconstruction with DeepONet and Fourier neural operators"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy==1.26.4",
    "scipy==1.12.0",
    "pandas==2.2.3",
    "matplotlib==3.8.3",
    "PyYAML==6.0.2",
    "jax==0.4.26",
    "jaxlib==0.4.26",
    "flax==0.8.3",
    "optax==0.2.2",
    "chex==0.1.86",
    "orbax-checkpoint==0.5.11",
    "tqdm==4.66.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "build>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
